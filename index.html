<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6F4A" />
    <meta name="description" content="As suas compras de supermercado, lidas a partir das notas." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Served by the backend so the installed-app name follows APP_NAME_FOR_CUSTOMER. -->
    <link rel="manifest" href="/v1/config/manifest.webmanifest" />
    <!-- Fallback only: the app replaces it with the name from GET /v1/config. -->
    <title>Super Mercado</title>
    <!-- The theme before the first paint, so the page does not flash light: the same choice as src/lib/theme.ts (key "basketiq.theme"). -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("basketiq.theme");
          var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <!-- The text size before the first paint: the same table as src/lib/textSize.ts (key "basketiq.textSize"). -->
    <script>
      (function () {
        try {
          var scales = { menor: 0.85, padrao: 0.94, maior: 1.06, "muito-maior": 1.19, maximo: 1.31 };
          var scale = scales[localStorage.getItem("basketiq.textSize")];
          if (scale) document.documentElement.style.setProperty("--text-scale", String(scale));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicação precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
